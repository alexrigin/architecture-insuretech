apiVersion: v1
kind: Namespace
metadata:
  name: test
  labels:
    name: test

---

apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: amd64-emulation
handler: runc
scheduling:
  nodeSelector:
    kubernetes.io/arch: arm64

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: test
  labels:
    app: test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  strategy:
    # type: Recreate
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 10
      maxUnavailable: 0
  template:
    metadata:
      labels: 
        app: test-app
    spec:
      runtimeClassName: amd64-emulation 
      containers:
      - name: test-app
        image: ghcr.io/yandex-practicum/scaletestapp:latest
        imagePullPolicy: Never
        ports:
         - containerPort: 8080
        resources:
          limits:
            # cpu: "500m"
            memory: "20Mi" 
          # requests:
          #   cpu: "100m"
          #   memory: "128Mi"
        # readinessProbe:
        #   httpGet:
        #     path: /api/users
        #     port: 8080
        #   initialDelaySeconds: 5
        #   periodSeconds: 10
        # livenessProbe:
        #   httpGet:
        #     path: /api/users
        #     port: 8080
        #   initialDelaySeconds: 15
        #   periodSeconds: 20
      # restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: test-app
  namespace: test
spec:
  selector:
    app: test-app
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-app
  namespace: test
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: localhost
      http:
        paths:

          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-app
                port:
                  number: 8080